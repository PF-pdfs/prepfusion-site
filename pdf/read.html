<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>PrepFusion PDF Viewer</title>
<link rel="icon" href="assets/favicon.png">
<script>
  /* Match the library's theme before first paint so the reader never flashes. */
  try{
    var t = localStorage.getItem('pf-theme');
    document.documentElement.setAttribute('data-theme', (t==='dark'||t==='light') ? t : 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
  try{
    if(localStorage.getItem('pf-reader-night') === '1')
      document.documentElement.setAttribute('data-night','1');
  }catch(e){}
</script>
<style>
*,*::before,*::after{box-sizing:border-box}
/* A display rule on a class beats the UA's [hidden]{display:none}, so the
   Contents button stayed visible on PDFs with no outline. Restore it. */
[hidden]{display:none !important}
:root{
  --paper:#f7f8fa; --card:#fff; --ink:#0f172a; --ink-soft:#4f6080;
  --line:#e2e6ee; --line-strong:#cbd3e1; --accent:#facc15; --shell:#eef1f6;
  --brand:#14307f;
  /* See the library stylesheet: --brand against --ink is only ~1.6:1, so the
     two-tone wordmark needs its own vivid blue to actually be visible. */
  --wordmark:#1668d6;
}
/* Night mode darkens the whole viewer, not just the pages. Inverting the
   paper while leaving a white toolbar above it is exactly the glare the
   reader is meant to remove, so night forces the dark tokens on regardless
   of which theme the library itself is in. */
:root[data-theme="dark"],
:root[data-night="1"]{
  --paper:#0b1020; --card:#141b2e; --ink:#e8edf7; --ink-soft:#9aa8c4;
  --line:#233049; --line-strong:#33415f; --shell:#070b16;
  --brand:#9db6ff;
  --wordmark:#4d92ff;
}
html,body{margin:0;padding:0}
body{background:var(--shell);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%}

/* ---------- top bar ---------- */
/* Bar and drawer stick as one unit. Sticking only the bar and letting the
   drawer sit in normal flow meant that opening Contents from halfway down a
   book rendered it off-screen above you — the one moment you actually need
   it. Wrapping them avoids hard-coding a top offset, which would break
   anyway as soon as the toolbar wraps to two rows on a phone. */
.rtop{position:sticky;top:0;z-index:20}
.rbar{display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--card);border-bottom:1.5px solid var(--line);
  flex-wrap:wrap;row-gap:8px}
.rbar a.back{display:inline-flex;align-items:center;gap:7px;color:var(--ink);
  text-decoration:none;font-weight:650;font-size:14px;padding:7px 12px;
  border:1.5px solid var(--line-strong);border-radius:9px;white-space:nowrap}
.rbar a.back:hover{border-color:var(--ink)}
.rtitle{font-weight:700;font-size:14px;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:1}
/* BETA rides inside the Night button — the inversion is the beta part, not
   the viewer, and putting the badge anywhere else implied otherwise. */
.beta{font:700 9px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;
  padding:3px 5px;border-radius:4px;background:var(--accent);color:#0f172a;margin-left:3px}
/* Same brand_wordmark() markup as the library page (a real logo.* under
   assets/, or a circular "P" monogram when there isn't one) — .bm/.bm-logo/
   .bm-mono/.bm-text classes duplicated here because the reader ships its own
   standalone stylesheet rather than sharing the library's. */
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;flex:none}
.bm{display:inline-flex;align-items:center;gap:8px;color:inherit}
.bm-logo{width:22px;height:22px;border-radius:50%;object-fit:cover;display:block;flex-shrink:0}
.bm-mono{display:grid;place-items:center;font:800 12px "Sora",sans-serif;
  background:var(--ink);color:var(--paper)}
.bm-text{font:700 14px "Sora",sans-serif;letter-spacing:-.02em}
/* "Fusion" in the wordmark blue, "Prep" in the ordinary ink — matches the
   two-tone wordmark on the library page's header/footer. */
.bm-text b{font-weight:800;color:var(--wordmark)}
.brand-suffix{font-weight:600;font-size:13px;color:var(--ink-soft)}
.spacer{flex:1}

/* ---------- contents drawer ---------- */
/* Pushes the pages down rather than floating over them: an overlay panel on a
   phone covers the very text you opened it to find. */
.tocpanel{max-height:min(50vh,420px);overflow:auto;background:var(--card);
  border-bottom:1.5px solid var(--line);padding:8px 10px}
.tocpanel ol{list-style:none;margin:0;padding:0}
/* Children live in a real nested list, indented and collapsible — a shelf
   book can carry a thousand-entry outline (the NexusX master has 1,363),
   and a flat always-open list at that size IS the whole screen. */
.tocpanel ol ol{padding-left:20px}
.toc-tools{display:flex;gap:8px;justify-content:flex-end;padding:2px 4px 8px}
.toc-tools button{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.05em;
  color:var(--ink-soft);background:none;border:1.5px solid var(--line-strong);
  border-radius:7px;padding:5px 10px;cursor:pointer}
.toc-tools button:hover{color:var(--ink);border-color:var(--ink)}
.toc-row{display:flex;align-items:center;gap:2px}
.toc-jump{flex:1;min-width:0;display:block;text-align:left;background:none;border:0;
  color:var(--ink);font:inherit;font-size:13.5px;line-height:1.45;padding:7px 9px;
  border-radius:7px;cursor:pointer}
.toc-jump:hover{background:var(--shell)}
.tocpanel ol ol .toc-jump{font-size:13px;color:var(--ink-soft)}
.tocpanel ol ol ol .toc-jump{font-size:12.5px}
/* The chevron only toggles children — jumping stays on the title, so a
   mis-tap can't teleport you while you're just browsing the tree. */
.toc-tgl{flex:none;width:26px;height:26px;display:grid;place-items:center;
  background:none;border:0;border-radius:7px;color:var(--ink-soft);cursor:pointer}
.toc-tgl:hover{background:var(--shell);color:var(--ink)}
.toc-tgl svg{transition:transform .15s}
.toc-tgl[aria-expanded="true"] svg{transform:rotate(90deg)}
/* Leaf rows get the same left offset so titles line up with siblings. */
.toc-pad{flex:none;width:26px}
.rbtn{display:inline-flex;align-items:center;gap:7px;font:650 13px/1 inherit;
  padding:8px 12px;border-radius:9px;border:1.5px solid var(--line-strong);
  background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.rbtn:hover{border-color:var(--ink)}
.rbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font:600 12px/1 "IBM Plex Mono",monospace;color:var(--ink-soft);
  white-space:nowrap;flex:none}

/* ---------- caveat strip ---------- */
.caveat{display:none;padding:9px 16px;font-size:12.5px;color:var(--ink-soft);
  background:var(--card);border-bottom:1.5px solid var(--line);line-height:1.5}
:root[data-night="1"] .caveat{display:block}

/* ---------- initial loader ----------
   Bridges the gap between navigating here and the first page appearing —
   without this the whole viewer is a blank rectangle while the PDF's
   header/xref is fetched, which reads as broken rather than loading. */
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:110px 20px 60px;color:var(--ink-soft)}
.spinner{width:32px;height:32px;border-radius:50%;flex:none;
  border:3px solid var(--line-strong);border-top-color:var(--ink);
  animation:pfspin .8s linear infinite}
@keyframes pfspin{to{transform:rotate(360deg)}}
.loader-text{font:600 12.5px/1 "IBM Plex Mono",monospace;letter-spacing:.02em;margin:0}
.loader-bar{width:220px;max-width:60vw;height:6px;border-radius:99px;
  background:var(--line);overflow:hidden;position:relative}
.loader-fill{height:100%;width:0;background:var(--ink);border-radius:99px;
  transition:width .25s ease}
/* Total size isn't always known up front (no Content-Length, or the request
   is still negotiating) — an indeterminate sweep still says "working",
   which is the whole point, without inventing a percentage we don't have. */
.loader-bar.indeterminate .loader-fill{width:30%!important;position:absolute;
  animation:pfsweep 1.1s ease-in-out infinite}
@keyframes pfsweep{0%{left:-35%}100%{left:105%}}

/* ---------- pages ---------- */
main{padding:20px 10px 60px;display:flex;flex-direction:column;
  align-items:center;gap:16px}
.pg{position:relative;background:#fff;box-shadow:0 2px 14px rgba(15,23,42,.14);border-radius:2px;
  width:100%;max-width:1100px;display:flex;align-items:center;justify-content:center;
  gap:9px;color:#94a3b8;font:600 12px/1 "IBM Plex Mono",monospace;min-height:120px;
  /* Jumping from Contents aligns the page with the viewport top, which the
     sticky toolbar would then sit on top of. --barh is measured live at jump
     time because the toolbar is one row on a desktop and two on a phone, so
     no fixed value is correct for both. */
  scroll-margin-top:calc(var(--barh, 118px) + 12px)}
/* Same spinner, smaller — shown per-page while it waits its turn to render,
   so scrolling ahead of the lazy loader doesn't look stuck either. */
.pg-spin{width:15px;height:15px;border-radius:50%;flex:none;
  border:2px solid var(--line-strong);border-top-color:#94a3b8;
  animation:pfspin .8s linear infinite}
.pg canvas{display:block;max-width:100%;height:auto;border-radius:2px}
/* One of these per link annotation in the page (a URL, a QR code's own link
   box, a jump to another page) — the canvas is a flat raster image with no
   clickable regions of its own, so without this overlay every embedded link
   was inert. Positioned in the SAME viewport space draw() rendered the page
   at, from the PDF's own annotation rects, not guessed. Fully transparent at
   rest — the visible cue is the cursor and a faint highlight on hover, since
   the underlying page image already shows whatever the PDF drew for the link
   (an underline, a QR square, a "click here") and doubling that up would be
   redundant chrome sitting over someone else's content. */
.pg-link{position:absolute;cursor:pointer;border-radius:2px}
.pg-link:hover{background:rgba(37,99,235,.12);outline:1.5px solid rgba(37,99,235,.4)}
/* Night mode. invert() alone swings every hue to its opposite (blue -> orange);
   the hue-rotate swings them back, so a blue circuit trace stays blue-ish.
   It genuinely helps line art. It cannot rescue photographs. */
:root[data-night="1"] main{filter:invert(.92) hue-rotate(180deg)}
:root[data-night="1"] .pg{box-shadow:none}

/* ---------- messages ---------- */
.msg{max-width:560px;margin:60px auto;padding:0 20px;text-align:center;
  color:var(--ink-soft);line-height:1.65;font-size:15px}
.msg h2{color:var(--ink);font-size:19px;margin:0 0 10px}
.msg a{color:var(--ink);font-weight:650}
@media(max-width:860px){ .brand{display:none} }
@media(max-width:560px){
  .rtitle{order:5;flex-basis:100%;white-space:normal}
  main{padding:12px 6px 40px}
}
@media(prefers-reduced-motion:reduce){
  .spinner,.pg-spin{animation:none;border-top-color:var(--line-strong)}
  .loader-fill{transition:none;animation:none!important}
}
</style>
</head>
<body>

<div class="rtop">
<header class="rbar">
  <a class="back" href="./index.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
    </svg>Library</a>
  <span class="brand"><span class="bm"><img class="bm-logo" src="assets/logo.png" alt="" loading="lazy"><span class="bm-text">Prep<b>Fusion</b></span></span><span class="brand-suffix">PDF Viewer</span></span>
  <span class="rtitle" id="rtitle">Loading…</span>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
  <!-- Revealed only when the PDF actually carries an outline. -->
  <button class="rbtn" id="toc" type="button" aria-pressed="false" aria-controls="tocpanel" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/>
    </svg>Contents
  </button>
  <button class="rbtn" id="night" type="button" aria-pressed="false"
          title="Night mode inverts the page. Text reads well; diagrams, graphs and photos may look like negatives.">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
    </svg>Night<span class="beta">BETA</span>
  </button>
  <a class="rbtn" id="dl" href="#" download>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/>
    </svg>Download
  </a>
</header>
<nav class="tocpanel" id="tocpanel" hidden aria-label="Contents">
  <div class="toc-tools" id="tocTools" hidden>
    <button type="button" id="tocExpand">Expand all</button>
    <button type="button" id="tocCollapse">Collapse all</button>
  </div>
  <ol id="toclist"></ol>
</nav>
</div>

<p class="caveat">Night mode is a colour inversion — diagrams, graphs and photographs may look
like negatives. Download the file to read it exactly as printed.</p>

<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <p class="loader-text" id="loaderText">Loading PDF…</p>
  <div class="loader-bar" id="loaderBar"><div class="loader-fill" id="loaderFill"></div></div>
</div>
<main id="pages"></main>
<div class="msg" id="msg" hidden></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const root = document.documentElement;

function fail(title, body, href){
  $('pages').remove();
  const ldr = $('loader');
  if(ldr) ldr.remove();
  const m = $('msg');
  m.hidden = false;
  m.innerHTML = '<h2></h2><p></p>';
  m.querySelector('h2').textContent = title;
  m.querySelector('p').textContent = body;
  if(href){
    const a = document.createElement('a');
    a.href = href; a.textContent = 'Download the PDF instead'; a.setAttribute('download','');
    m.appendChild(a);
  }
}

/* Only ever fetch a relative path inside this folder. The parameter is
   attacker-controllable via a crafted link, so absolute URLs, scheme-relative
   URLs and traversal are all refused rather than sanitised. */
function safeRel(p){
  if(!p) return null;
  if(/^[a-z][a-z0-9+.\-]*:/i.test(p)) return null;
  if(p.startsWith('/') || p.startsWith('\\') || p.startsWith('//')) return null;
  if(p.split(/[\/\\]/).some(s => s === '..')) return null;
  return p;
}

const qs  = new URLSearchParams(location.search);
const rel = safeRel(qs.get('f'));
const ver = qs.get('v') || '';
const titleParam = (qs.get('t') || '').trim();

if(!rel){
  fail('Nothing to read', 'That link is missing a valid file reference. Head back to the library and pick a book.');
} else {
  const url   = './' + rel.split('/').map(encodeURIComponent).join('/') + (ver ? '?v=' + encodeURIComponent(ver) : '');
  // The clean "<Subject> — <Branch>" title is computed server-side (see
  // reader_title() in build_site.py), which already knows the subject and
  // branch for this exact file rather than guessing from its filename. The
  // raw-filename cleanup below only ever runs if that param is missing or
  // empty — e.g. an old bookmarked link from before this existed.
  const name = titleParam ||
    decodeURIComponent(rel.split('/').pop() || '').replace(/\.pdf$/i,'').replace(/[_-]+/g,' ');
  $('rtitle').textContent = name;
  document.title = name + ' — PrepFusion PDF Viewer';
  $('dl').href = url;
  // Same rule as clean_filename() server-side: what's saved to disk matches
  // what's shown on screen, not the raw "network_theory_ec.pdf" filename.
  const safeName = name.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim();
  $('dl').setAttribute('download', (safeName || 'download') + '.pdf');

  /* ---- night toggle ---- */
  const nightBtn = $('night');
  const setNight = (on) => {
    root.setAttribute('data-night', on ? '1' : '0');
    nightBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    try{ localStorage.setItem('pf-reader-night', on ? '1' : '0'); }catch(e){}
  };
  setNight(root.getAttribute('data-night') === '1');
  nightBtn.addEventListener('click', () =>
    setNight(nightBtn.getAttribute('aria-pressed') !== 'true'));

  /* ---- render ---- */
  let pdfjsLib;
  try{
    pdfjsLib = await import('./assets/pdfjs/pdf.mjs');
  }catch(e){
    fail('The reader could not start',
         'The PDF engine failed to load. You can still read this book in your browser or app.', url);
    throw e;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = './assets/pdfjs/pdf.worker.mjs';

  const holder = $('pages');
  let doc, scale = 1;

  // A fast scroll, or a bookmark jump landing far from where the reader was
  // (scrollIntoView below, potentially hundreds of pages away), can sweep
  // dozens of placeholders through the 900px margin within a couple of
  // frames — the observer fired draw() for every one of them immediately,
  // with no cap, so a burst like that meant that many concurrent canvas
  // allocations and pdf.js render tasks in flight AT ONCE. Desktop's spare
  // RAM/CPU absorbs that; mobile's doesn't, which is exactly the "fine on
  // desktop, crashes/glitches on mobile" pattern reported — and exactly
  // when it was reported (fast scrolling, or a distant bookmark jump).
  // RENDER_CONCURRENCY caps how many pages are ever being rasterised at the
  // same moment; everything past that just waits its turn in queue instead
  // of piling on. The eventual visual result is identical, only throttled.
  const RENDER_CONCURRENCY = 2;
  let activeRenders = 0;
  const renderQueue = [];
  function pumpRenderQueue(){
    while(activeRenders < RENDER_CONCURRENCY && renderQueue.length){
      const [n, el] = renderQueue.shift();
      activeRenders++;
      draw(n, el).finally(() => { activeRenders--; pumpRenderQueue(); });
    }
  }

  const io = new IntersectionObserver((entries) => {
    for(const e of entries){
      if(!e.isIntersecting) continue;
      const el = e.target;
      if(el.dataset.done) continue;
      el.dataset.done = '1';
      io.unobserve(el);
      renderQueue.push([Number(el.dataset.n), el]);
    }
    pumpRenderQueue();
  }, { rootMargin: '900px 0px' });

  // Mobile Safari (and some Android WebViews) refuse to allocate a canvas
  // past ~4096px on a side — go over this and the canvas silently comes back
  // blank instead of erroring, which is worse than the blur it would replace.
  const MAX_CANVAS_DIM = 4096;

  async function draw(n, el){
    try{
      const page = await doc.getPage(n);
      const vp   = page.getViewport({ scale });

      // Most phones today are 3x, some display panels 4x. The previous cap
      // of 2 rendered visibly softer than the screen could show — capping
      // too low was the actual cause of the blur being reported, not pdf.js.
      // Still clamp against MAX_CANVAS_DIM so a wide page at 4x on a small
      // phone can't ask for a canvas the browser will refuse.
      const wantDpr = Math.min(window.devicePixelRatio || 1, 3);
      const dpr = Math.max(1, Math.min(
        wantDpr,
        MAX_CANVAS_DIM / vp.width,
        MAX_CANVAS_DIM / vp.height
      ));

      const c    = document.createElement('canvas');
      c.width  = Math.floor(vp.width  * dpr);
      c.height = Math.floor(vp.height * dpr);
      c.style.width  = vp.width  + 'px';
      c.style.height = vp.height + 'px';
      await page.render({
        canvasContext: c.getContext('2d', { alpha:false }),
        viewport: vp,
        transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null
      }).promise;
      el.textContent = '';
      el.style.minHeight = '';
      el.appendChild(c);
      await drawLinks(page, vp, el);
    }catch(e){
      el.textContent = 'Page ' + n + ' could not be drawn';
    }
  }

  // The canvas above is a flat raster image — a QR code, a "click here for
  // the video" line, any URL the PDF's author actually embedded as a real
  // link annotation, was completely inert without this. One transparent <a>
  // per link annotation, positioned from the PDF's own rect (converted into
  // the SAME viewport draw() just rendered at, so it lines up with the image
  // regardless of zoom/DPR) rather than guessed from the page image.
  async function drawLinks(page, vp, el){
    let annots;
    try{ annots = await page.getAnnotations(); }catch(e){ return; }
    for(const a of annots){
      // unsafeUrl is pdf.js's own name for this field — "unsafe" because
      // it hasn't sanitised the scheme yet, which is exactly why target and
      // rel are set explicitly below rather than trusting the PDF author.
      const url = a.url || a.unsafeUrl;
      if(!url && !a.dest) continue;   // not a link annotation (e.g. a form field)

      // No convertToViewportRectangle on this pdf.js build (verified live,
      // not assumed) — only convertToViewportPoint, so each corner is
      // converted individually and the box built from those two points.
      // PDF space is bottom-up; the viewport is top-down, so which corner
      // ends up smaller/larger flips too — min/max below, not a fixed order.
      const p1 = vp.convertToViewportPoint(a.rect[0], a.rect[1]);
      const p2 = vp.convertToViewportPoint(a.rect[2], a.rect[3]);
      const x = Math.min(p1[0], p2[0]), y = Math.min(p1[1], p2[1]);
      const w = Math.abs(p2[0] - p1[0]), h = Math.abs(p2[1] - p1[1]);

      const link = document.createElement('a');
      link.className = 'pg-link';
      link.style.left = x + 'px';
      link.style.top = y + 'px';
      link.style.width = w + 'px';
      link.style.height = h + 'px';

      if(url){
        // Same reasoning as every outbound link elsewhere on this site
        // (see the ".ext" arrow on the nav's Courses/YouTube links): a
        // visitor reading a book should never lose their place in the
        // reader because a reference link opened in the same tab.
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      } else {
        // Internal link (a cross-reference to another page in the SAME
        // book) — resolve it the same way the Contents drawer already
        // does, and scroll there instead of leaving the tab.
        link.href = '#';
        link.addEventListener('click', async (e) => {
          e.preventDefault();
          try{
            const d = typeof a.dest === 'string' ? await doc.getDestination(a.dest) : a.dest;
            const ref = Array.isArray(d) ? d[0] : null;
            const destN = ref && typeof ref === 'object' ? (await doc.getPageIndex(ref)) + 1
                        : (typeof ref === 'number' ? ref + 1 : null);
            const target = destN && holder.querySelector('.pg[data-n="' + destN + '"]');
            if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
          }catch(err){}
        });
      }
      el.appendChild(link);
    }
  }

  /* ---- initial loading state ----
     From here to the first page appearing is otherwise a blank rectangle —
     indistinguishable from broken, especially on a slow mobile connection
     opening a large scanned book. onProgress fires while pdf.js is still
     negotiating the file; a real percentage when the server sent a
     Content-Length (GitHub Pages always does), an honest "still working"
     sweep with the bytes-so-far when it hasn't. */
  const loaderText = $('loaderText'), loaderBar = $('loaderBar'), loaderFill = $('loaderFill');
  function humanSize(n){
    if(!n) return '0 B';
    const u = ['B','KB','MB','GB']; let i = 0;
    while(n >= 1024 && i < u.length - 1){ n /= 1024; i++; }
    return (i === 0 ? Math.round(n) : n.toFixed(1)) + ' ' + u[i];
  }

  try{
    /* disableAutoFetch keeps a 60 MB book from downloading in full before
       page one appears — pdf.js range-requests only what is on screen.

       wasmUrl and standardFontDataUrl matter more than they look for this
       library: previous-year papers are frequently scans, and scans lean on
       the JBIG2/JPEG2000 decoders in wasm/. standard_fonts/ covers PDFs that
       never embedded their base-14 fonts. Both are fetched only when a file
       actually needs them, so a clean digital PDF pays nothing for them. */
    const task = pdfjsLib.getDocument({
      url,
      disableAutoFetch:true,
      disableStream:false,
      wasmUrl: './assets/pdfjs/wasm/',
      standardFontDataUrl: './assets/pdfjs/standard_fonts/'
    });
    task.onProgress = ({ loaded, total }) => {
      if(total){
        loaderBar.classList.remove('indeterminate');
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        loaderFill.style.width = pct + '%';
        loaderText.textContent = 'Loading… ' + pct + '%';
      } else {
        loaderBar.classList.add('indeterminate');
        loaderText.textContent = 'Loading… ' + humanSize(loaded);
      }
    };
    doc = await task.promise;
  }catch(e){
    fail('This book could not be opened',
         'The file may still be uploading, or your connection dropped part-way.', url);
    throw e;
  }

  $('loader').remove();
  $('count').textContent = doc.numPages + (doc.numPages === 1 ? ' page' : ' pages');

  const first = await doc.getPage(1);
  const base  = first.getViewport({ scale:1 });
  const fit   = () => Math.max(.25, (Math.min(holder.clientWidth, 1100) - 12) / base.width);
  scale = fit();

  // Small spinner + label rather than a bare page number, so a page waiting
  // its turn to render reads as "loading" instead of "empty".
  const pendingHTML = (n) =>
    '<span class="pg-spin" aria-hidden="true"></span><span>Page ' + n + '</span>';

  /* One placeholder per page, sized from page one. Near-uniform in practice,
     and it means we never touch pages the reader has not scrolled to. */
  for(let n = 1; n <= doc.numPages; n++){
    const el = document.createElement('div');
    el.className = 'pg';
    el.dataset.n = n;
    el.style.minHeight = Math.round(base.height * scale) + 'px';
    el.innerHTML = pendingHTML(n);
    holder.appendChild(el);
    io.observe(el);
  }

  /* ---- contents ----
     The same thing Chrome's viewer calls bookmarks: the outline the PDF was
     authored with. Plenty of scanned papers have none, so the button stays
     hidden rather than opening an empty drawer. */
  (async () => {
    let outline = null;
    try{ outline = await doc.getOutline(); }catch(e){}
    if(!outline || !outline.length) return;

    const list = $('toclist'), panel = $('tocpanel'), btn = $('toc');

    /* An outline entry points at an internal destination, not a page number —
       it has to be resolved through the document to find the page. */
    async function pageOf(dest){
      try{
        const d = typeof dest === 'string' ? await doc.getDestination(dest) : dest;
        if(!Array.isArray(d)) return null;
        const ref = d[0];
        if(ref && typeof ref === 'object') return (await doc.getPageIndex(ref)) + 1;
        if(typeof ref === 'number') return ref + 1;
      }catch(e){}
      return null;
    }

    function jumpTo(it){
      return async () => {
        const n = await pageOf(it.dest);
        const el = n && holder.querySelector('.pg[data-n="' + n + '"]');
        if(!el) return;
        /* Close on pick. On a phone the drawer covers most of the screen,
           so leaving it open hides the page you just jumped to. */
        panel.hidden = true;
        btn.setAttribute('aria-pressed', 'false');
        /* Read the bar's height after the drawer has closed — this forces
           the reflow, so the value is the one the scroll will actually
           land against. */
        root.style.setProperty('--barh',
          document.querySelector('.rtop').getBoundingClientRect().height + 'px');
        el.scrollIntoView({ behavior:'smooth', block:'start' });
      };
    }

    /* A real tree, not a flat indented list. Everything deeper than the top
       level starts COLLAPSED: a shelf book can carry a four-figure outline,
       and opening the drawer onto all of it at once is a wall, not a map.
       The chevron toggles children; the title always jumps. */
    let hasChildren = false;
    (function add(items, parentOl){
      for(const it of items){
        const li  = document.createElement('li');
        const row = document.createElement('div');
        row.className = 'toc-row';

        const kids = it.items && it.items.length ? it.items : null;
        if(kids){
          hasChildren = true;
          const tgl = document.createElement('button');
          tgl.type = 'button';
          tgl.className = 'toc-tgl';
          tgl.setAttribute('aria-expanded', 'false');
          tgl.setAttribute('aria-label', 'Expand section');
          tgl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" '
            + 'stroke="currentColor" stroke-width="2.6" stroke-linecap="round" '
            + 'stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
          row.appendChild(tgl);
        } else {
          const pad = document.createElement('span');
          pad.className = 'toc-pad';
          row.appendChild(pad);
        }

        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'toc-jump';
        b.textContent = it.title || '(untitled)';
        b.addEventListener('click', jumpTo(it));
        row.appendChild(b);
        li.appendChild(row);

        if(kids){
          const sub = document.createElement('ol');
          sub.hidden = true;
          add(kids, sub);
          li.appendChild(sub);
          row.firstChild.addEventListener('click', () => {
            const open = sub.hidden;
            sub.hidden = !open;
            row.firstChild.setAttribute('aria-expanded', open ? 'true' : 'false');
            row.firstChild.setAttribute('aria-label',
              open ? 'Collapse section' : 'Expand section');
          });
        }
        parentOl.appendChild(li);
      }
    })(outline, list);

    /* Expand/Collapse all — only offered when there is actually a tree. */
    if(hasChildren){
      const setAll = (open) => {
        for(const sub of panel.querySelectorAll('ol ol')) sub.hidden = !open;
        for(const t of panel.querySelectorAll('.toc-tgl')){
          t.setAttribute('aria-expanded', open ? 'true' : 'false');
          t.setAttribute('aria-label', open ? 'Collapse section' : 'Expand section');
        }
      };
      $('tocTools').hidden = false;
      $('tocExpand').addEventListener('click', () => setAll(true));
      $('tocCollapse').addEventListener('click', () => setAll(false));
    }

    btn.hidden = false;
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-pressed') !== 'true';
      btn.setAttribute('aria-pressed', open ? 'true' : 'false');
      panel.hidden = !open;
    });
  })();

  /* Re-fit on rotate/resize: clear everything and let the observer redraw. */
  let t;
  addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const next = fit();
      if(Math.abs(next - scale) < .01) return;
      scale = next;
      for(const el of holder.children){
        el.dataset.done = '';
        el.innerHTML = pendingHTML(el.dataset.n);
        el.style.minHeight = Math.round(base.height * scale) + 'px';
        io.observe(el);
      }
    }, 200);
  });
}
</script>
</body>
</html>
