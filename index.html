<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=pdf/">
<link rel="canonical" href="https://pyq.prepfusion.in/pdf/">
<title>PrepFusion Library</title>
<meta name="description" content="Free GATE preparation PDFs — NexusX, SiliconX, PowerX, Maths and Aptitude series. Previous year questions and detailed solutions.">
<link rel="icon" href="pdf/assets/favicon.png">
<!-- These are NOT redundant with /pdf/'s own tags. Link-preview crawlers
     (WhatsApp, Telegram, iMessage, Slack) fetch a URL, parse the raw HTML for
     og:/twitter: tags, and stop — none of them run the JS location.replace()
     below, and none of them honour <meta http-equiv="refresh"> either. Share
     the short root URL without these and the crawler sees a bare <title> and
     nothing else, because that's genuinely all this page had. -->
<meta property="og:type" content="website">
<meta property="og:title" content="PrepFusion Library">
<meta property="og:description" content="Free GATE preparation PDFs — NexusX, SiliconX, PowerX, Maths and Aptitude series. Previous year questions and detailed solutions.">
<meta property="og:url" content="https://pyq.prepfusion.in/pdf/">
<meta property="og:image" content="https://pyq.prepfusion.in/pdf/assets/og-image.png">
<meta name="twitter:image" content="https://pyq.prepfusion.in/pdf/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PrepFusion Library">
<meta name="twitter:description" content="Free GATE preparation PDFs — NexusX, SiliconX, PowerX, Maths and Aptitude series. Previous year questions and detailed solutions.">
<style>
  html{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    background:#f2f5fa;color:#0a1020;
    font:400 16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
  @media(prefers-color-scheme:dark){body{background:#0a1020;color:#f2f6ff}}
  a{color:inherit;font-weight:650}
  p{color:#5b6b88;margin:0 0 14px}
  @media(prefers-color-scheme:dark){p{color:#a9b8d6}}
</style>
</head>
<body>
  <main>
    <p>Opening the library&hellip;</p>
    <a href="pdf/">Go to the PrepFusion Library</a>
  </main>
  <script>
    /* replace(), not href — a redirect that lands in history traps the Back
       button: leaving the library would bounce straight back into it. */
    location.replace('pdf/');
  </script>
</body>
</html>
